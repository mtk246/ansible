---
- name: Configure Homelab
  hosts: homelab
  become: true

  tasks:

    - name: Check connectivity
      ansible.builtin.ping:

    - name: Get hostname
      ansible.builtin.command: hostname
      register: hostname_result
      changed_when: false

    - name: Show hostname
      ansible.builtin.debug:
        msg: "Connected to {{ hostname_result.stdout }}"

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-plugin
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
